product: jvm/app

dependencies:
  - ../game-content
  - ../game-protocol
  - ../game-server
  - $compose.desktop.currentOs
  - $compose.material3
  - io.github.pandulapeter.kubriko:engine-desktop:0.1.2
  - io.github.pandulapeter.kubriko:plugin-collision-desktop:0.1.2
  - io.github.pandulapeter.kubriko:plugin-serialization-desktop:0.1.2
  - io.github.pandulapeter.kubriko:tool-scene-editor-desktop:0.1.2
  - io.github.pandulapeter.kubriko:tool-scene-editor-api-desktop:0.1.2

settings:
  kotlin:
    serialization:
      format: json
      version: 1.11.0
  compose:
    enabled: true
  jvm:
    mainClass: com.tankarena.app.editor.MainKt
