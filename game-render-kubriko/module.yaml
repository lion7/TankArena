  - ../game-protocol
  - ../game-sim
  - $compose.desktop.currentOs
  - io.github.pandulapeter.kubriko:engine-desktop:0.1.1
  - io.github.pandulapeter.kubriko:plugin-keyboard-input-desktop:0.1.1
  - io.github.pandulapeter.kubriko:plugin-sprites-desktop:0.1.1
  - io.github.pandulapeter.kubriko:plugin-collision-desktop:0.1.1

settings:
  kotlin:
    version: 2.3.20
  compose:
    enabled: true
    version: 1.10.0
