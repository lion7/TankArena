product:
  type: lib
  platforms: [jvm]

repositories:
  - mavenLocal

dependencies:
  - ../game-content
  - ../game-protocol
  - $compose.desktop.currentOs
  - io.github.pandulapeter.kubriko:engine-desktop:0.1.1
  - io.github.pandulapeter.kubriko:plugin-collision-desktop:0.1.1
  - io.github.pandulapeter.kubriko:plugin-serialization-desktop:0.1.1

settings:
  kotlin:
    version: 2.3.20
    serialization:
      format: json
      version: 1.11.0
  compose:
    enabled: true
    version: 1.10.0
